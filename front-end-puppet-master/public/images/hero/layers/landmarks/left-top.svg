<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Landmark card - abstract geometric shape -->
  <defs>
    <linearGradient id="landmarkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--i-brand);stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:var(--i-accent);stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect x="20" y="30" width="160" height="100" rx="12" fill="url(#landmarkGrad1)" />
  <circle cx="60" cy="70" r="15" fill="var(--p-white)" opacity="0.9" />
  <rect x="85" y="55" width="70" height="10" rx="5" fill="var(--p-white)" opacity="0.8" />
  <rect x="85" y="75" width="50" height="8" rx="4" fill="var(--p-white)" opacity="0.6" />
</svg>
