<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- Front cloud layer - highest opacity, most defined clouds -->
  <defs>
    <linearGradient id="cloudGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--p-white);stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:var(--p-white);stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <ellipse cx="180" cy="100" rx="140" ry="50" fill="url(#cloudGrad3)" />
  <ellipse cx="420" cy="85" rx="160" ry="60" fill="url(#cloudGrad3)" />
  <ellipse cx="650" cy="110" rx="120" ry="45" fill="url(#cloudGrad3)" />
</svg>
