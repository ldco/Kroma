<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- Far cloud layer - subtle, wispy clouds -->
  <defs>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:var(--p-white);stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:var(--p-white);stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="120" rx="120" ry="40" fill="url(#cloudGrad1)" />
  <ellipse cx="350" cy="100" rx="150" ry="50" fill="url(#cloudGrad1)" />
  <ellipse cx="550" cy="130" rx="100" ry="35" fill="url(#cloudGrad1)" />
  <ellipse cx="680" cy="110" rx="90" ry="30" fill="url(#cloudGrad1)" />
</svg>
