name: CSS Tokens Lint

on:
  push:
    paths:
      - 'frontend-nuxt/assets/css/**/*.css'
      - 'frontend-nuxt/scripts/lint-css-tokens.js'
  pull_request:
    paths:
      - 'frontend-nuxt/assets/css/**/*.css'
      - 'frontend-nuxt/scripts/lint-css-tokens.js'

jobs:
  lint-css-tokens:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-nuxt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nuxt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS tokens (enforce)
        run: npm run lint:css-tokens:enforce
        continue-on-error: false
